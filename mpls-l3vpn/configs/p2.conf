frr defaults traditional
hostname p2
service integrated-vtysh-config
log stdout
!
interface lo
 ip address 10.0.0.12/32
 ip router isis CORE
 isis passive
exit
!
interface eth1
 ip address 10.1.2.2/30
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 ip address 10.1.4.1/30
 ip router isis CORE
 isis network point-to-point
exit
!
router isis CORE
 net 49.0001.0000.0000.0012.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
exit
!
mpls ldp
 router-id 10.0.0.12
 address-family ipv4
  discovery transport-address 10.0.0.12
  interface eth1
  exit
  interface eth2
  exit
 exit-address-family
exit
!
