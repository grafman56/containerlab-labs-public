frr version 10.7
frr defaults traditional
hostname dc-app
service integrated-vtysh-config
!
interface eth1
 ip address 10.20.20.10/24
!
! Docker supplies the management default route on eth0. Install only the
! application destination route so return traffic uses the hub edge.
ip route 10.10.10.0/24 10.20.20.1
!
