frr version 10.7
frr defaults traditional
hostname branch1
service integrated-vtysh-config
!
interface eth1
 description Corp-LAN
 ip address 10.10.10.1/24
!
interface eth2
 description WAN-ISP-A
 ip address 100.64.1.2/30
!
interface eth3
 description WAN-ISP-B
 ip address 100.64.2.2/30
!
interface tun-isp-a
 description Primary-SD-WAN-overlay-via-ISP-A
 ip address 172.31.1.1/30
!
interface tun-isp-b
 description Backup-SD-WAN-overlay-via-ISP-B
 ip address 172.31.2.1/30
!
ip route 100.64.10.2/32 100.64.1.1
ip route 100.64.20.2/32 100.64.2.1
!
route-map PREFER-ISP-A permit 10
 set local-preference 200
!
route-map PREFER-ISP-B permit 10
 set local-preference 100
!
router bgp 65010
 bgp router-id 10.255.10.1
 no bgp ebgp-requires-policy
 neighbor 172.31.1.2 remote-as 65020
 neighbor 172.31.1.2 description HUB-over-ISP-A-primary
 neighbor 172.31.2.2 remote-as 65020
 neighbor 172.31.2.2 description HUB-over-ISP-B-backup
 !
 address-family ipv4 unicast
  network 10.10.10.0/24
  neighbor 172.31.1.2 activate
  neighbor 172.31.1.2 route-map PREFER-ISP-A in
  neighbor 172.31.2.2 activate
  neighbor 172.31.2.2 route-map PREFER-ISP-B in
 exit-address-family
!
