frr version 10.7
frr defaults traditional
hostname hub1
service integrated-vtysh-config
!
interface eth1
 description DC-application-network
 ip address 10.20.20.1/24
!
interface eth2
 description WAN-ISP-A
 ip address 100.64.10.2/30
!
interface eth3
 description WAN-ISP-B
 ip address 100.64.20.2/30
!
interface tun-isp-a
 description Primary-SD-WAN-overlay-via-ISP-A
 ip address 172.31.1.2/30
!
interface tun-isp-b
 description Backup-SD-WAN-overlay-via-ISP-B
 ip address 172.31.2.2/30
!
ip route 100.64.1.2/32 100.64.10.1
ip route 100.64.2.2/32 100.64.20.1
!
route-map PREFER-ISP-A permit 10
 set local-preference 200
!
route-map PREFER-ISP-B permit 10
 set local-preference 100
!
router bgp 65020
 bgp router-id 10.255.20.1
 no bgp ebgp-requires-policy
 neighbor 172.31.1.1 remote-as 65010
 neighbor 172.31.1.1 description BRANCH1-over-ISP-A-primary
 neighbor 172.31.2.1 remote-as 65010
 neighbor 172.31.2.1 description BRANCH1-over-ISP-B-backup
 !
 address-family ipv4 unicast
  network 10.20.20.0/24
  neighbor 172.31.1.1 activate
  neighbor 172.31.1.1 route-map PREFER-ISP-A in
  neighbor 172.31.2.1 activate
  neighbor 172.31.2.1 route-map PREFER-ISP-B in
 exit-address-family
!
