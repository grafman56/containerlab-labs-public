frr version 10.7
frr defaults traditional
hostname spine1
service integrated-vtysh-config
!
interface lo
 ip address 10.255.255.1/32
!
interface eth1
 description to-leaf1
 ip address 10.0.0.0/31
!
interface eth2
 description to-leaf2
 ip address 10.0.0.2/31
!
router bgp 65000
 bgp router-id 10.255.255.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65101
 neighbor 10.0.0.3 remote-as 65102
 neighbor 10.255.0.1 remote-as 65101
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.1 ebgp-multihop 3
 neighbor 10.255.0.1 disable-connected-check
 neighbor 10.255.0.2 remote-as 65102
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.2 ebgp-multihop 3
 neighbor 10.255.0.2 disable-connected-check
 !
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.3 activate
  network 10.255.255.1/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.2 activate
 exit-address-family
!
