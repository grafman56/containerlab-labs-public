frr version 10.7
frr defaults traditional
hostname leaf1
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 description to-spine1
 ip address 10.0.0.1/31
!
interface eth2
 description to-spine2
 ip address 10.0.0.5/31
!
router bgp 65101
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.0.0 remote-as 65000
 neighbor 10.0.0.4 remote-as 65000
 neighbor 10.255.255.1 remote-as 65000
 neighbor 10.255.255.1 update-source lo
 neighbor 10.255.255.1 ebgp-multihop 3
 neighbor 10.255.255.1 disable-connected-check
 neighbor 10.255.255.2 remote-as 65000
 neighbor 10.255.255.2 update-source lo
 neighbor 10.255.255.2 ebgp-multihop 3
 neighbor 10.255.255.2 disable-connected-check
 !
 address-family ipv4 unicast
  neighbor 10.0.0.0 activate
  neighbor 10.0.0.4 activate
  network 10.255.0.1/32
  maximum-paths 2
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.255.255.1 activate
  neighbor 10.255.255.2 activate
  advertise-all-vni
 exit-address-family
!
