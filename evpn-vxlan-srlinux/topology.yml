---
# Small EVPN-VXLAN fabric on Nokia SR Linux.
#
# Why this lab exists: on a real NOS the VLAN to VNI binding is configuration,
# not a kernel object. Every vni below is a line in the committed config, and
# the device prints both the number and the state. See README.md.
#
# Spin it up and down from this directory:
#
#   netlab create
#   netlab up
#   netlab validate
#   netlab down --cleanup
#
# Changing a mapping is a one-line edit: change vni under the VLAN, run
# netlab up again if the lab is already running.
name: evpn-srlinux

provider: clab

defaults:
  device: srlinux

module: [ vlan, vxlan, ospf, bgp, evpn, vrf ]

addressing:
  loopback:
    ipv4: 10.255.0.0/24
  router_id:
    ipv4: 10.255.0.0/24
  p2p:
    ipv4: 10.0.0.0/24
    prefix: 31
  mgmt:
    # Its own range and bridge, so this lab and enterprise-fabric can coexist
    # and neither collides with the Containerlab default of 172.20.20.0/24.
    ipv4: 172.21.20.0/24
    start: 100
    _network: netlab_evpn_srlinux

bgp:
  as: 65000

ospf:
  area: 0.0.0.0

# The mapping. VLAN id is the 802.1Q tag, vni is the VXLAN identifier, vrf is
# the routing instance the segment belongs to.
vlans:
  staff:
    id: 10
    vni: 1010
    vrf: tenant
    prefix: 10.10.10.0/24
  services:
    id: 20
    vni: 1020
    vrf: tenant
    prefix: 10.20.20.0/24
  visitor:
    id: 30
    vni: 1030
    vrf: guest
    prefix: 10.30.30.0/24

# Symmetric IRB. Each VRF gets its own transit VNI, the same way a real fabric
# does. netlab also assigns a local VLAN for each transit VNI.
#
# OSPF is off inside the VRFs. netlab would otherwise run it between the leaves
# over the IRB and redistribute it into the fw BGP session, and the two protocols
# loop each other's routes.
vrfs:
  tenant:
    evpn.transit_vni: 4100
    ospf: false
  guest:
    evpn.transit_vni: 4200
    ospf: false

groups:
  spines:
    members: [ s1, s2 ]
    bgp.rr: true
  leaves:
    members: [ l1, l2 ]

nodes:
  # Spines are plain FRR: underlay and EVPN route reflection only. They never
  # see a VLAN or a VNI, as on a real fabric. The mapping lives on the leaves.
  s1:
    id: 1
    device: frr
    module: [ ospf, bgp, evpn ]
  s2:
    id: 2
    device: frr
    module: [ ospf, bgp, evpn ]
  l1:
    id: 11
  l2:
    id: 12
  # Stand-in data path for the Palo Alto. Its zones are nftables sets, which
  # the PAN-OS emulator mirrors (see README). One zone per VRF.
  fw:
    id: 31
    device: frr
    module: [ bgp ]
    bgp.as: 65100
    clab.image: campus-firewall:1.0.0
  # Hosts. Two in the same segment on different leaves prove stretched L2 and
  # a remote type-2 route. The third is in another VRF and must not reach them.
  h1:
    id: 21
    device: linux
  h2:
    id: 22
    device: linux
  h3:
    id: 23
    device: linux
  h4:
    id: 24
    device: linux

links:
  # Underlay. OSPF area 0 on every fabric link.
  - s1-l1
  - s1-l2
  - s2-l1
  - s2-l2
  - s1-s2

  # Tenant segments. Same VLAN on both leaves, so the same VNI is stretched.
  - l1:
      vlan.access: staff
    h1:
  - l2:
      vlan.access: staff
    h2:
  - l2:
      vlan.access: visitor
    h3:
  - l1:
      vlan.access: services
    h4:

  # Firewall handoff. One routed link per VRF from the border leaf (l2), eBGP
  # per VRF. eth1 on fw is zone tenant, eth2 is zone guest.
  - l2:
      vrf: tenant
    fw:
  - l2:
      vrf: guest
    fw:

validate:
  ospf:
    description: Every fabric link is in OSPF full state
    wait: 60
    wait_msg: Waiting for the OSPF underlay
    nodes: [ l1, l2 ]
    devices: [ srlinux ]
    exec: show network-instance default protocols ospf neighbor
    valid: stdout.lower().count('full') >= 2
  evpn:
    description: Both leaves have an EVPN session to both route reflectors
    wait: 60
    wait_msg: Waiting for the EVPN overlay
    nodes: [ l1, l2 ]
    devices: [ srlinux ]
    exec: show network-instance default protocols bgp neighbor
    valid: stdout.lower().count('established') >= 2
