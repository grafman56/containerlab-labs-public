frr version 10.7
frr defaults traditional
hostname aar1
service integrated-vtysh-config
!
interface lo
 description Access-Aggregation-Router-role-loopback
 ip address 10.255.4.1/32
 ip ospf area 0
!
interface eth1
 description upstream-to-hub1
 ip address 10.10.9.0/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description upstream-to-hub2
 ip address 10.10.9.2/31
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.4.1
!
