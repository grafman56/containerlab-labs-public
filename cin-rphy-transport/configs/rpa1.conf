frr version 10.7
frr defaults traditional
hostname rpa1
service integrated-vtysh-config
!
interface lo
 description Remote-PHY-aggregation-role-loopback
 ip address 10.255.0.21/32
 ip ospf area 0
!
interface eth1
 description upstream-to-hub1
 ip address 10.10.1.0/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description upstream-to-hub2
 ip address 10.10.1.2/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth3
 description downstream-to-rpd1
 ip address 10.10.4.1/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth4
 description downstream-to-rpd2
 ip address 10.10.5.1/31
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.21
!
