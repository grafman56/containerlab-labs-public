frr version 10.7
frr defaults traditional
hostname service
service integrated-vtysh-config
!
interface lo
 description application-and-provisioning-service-loopback
 ip address 198.18.100.10/32
 ip ospf area 0
!
interface eth1
 description to-dsr1
 ip address 10.10.8.0/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description to-dsr2
 ip address 10.10.8.2/31
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 198.18.100.10
!
