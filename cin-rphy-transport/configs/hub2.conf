frr version 10.7
frr defaults traditional
hostname hub2
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.12/32
 ip ospf area 0
!
interface eth1
 description to-hub1
 ip address 10.10.0.0/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description to-rpa1
 ip address 10.10.1.3/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth3
 description to-rpa2
 ip address 10.10.2.3/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth4
 description to-vcmts
 ip address 10.10.3.3/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth5
 description to-dsr1
 ip address 10.10.6.3/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth6
 description to-dsr2
 ip address 10.10.7.3/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth7
 description to-aar1
 ip address 10.10.9.3/31
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.12
!
