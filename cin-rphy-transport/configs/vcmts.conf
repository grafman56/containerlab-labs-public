frr version 10.7
frr defaults traditional
hostname vcmts
service integrated-vtysh-config
!
interface lo
 description vCMTS-core-loopback-stand-in
 ip address 10.255.2.1/32
 ip ospf area 0
!
interface eth1
 description transport-to-hub1
 ip address 10.10.3.0/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description transport-to-hub2
 ip address 10.10.3.2/31
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.2.1
