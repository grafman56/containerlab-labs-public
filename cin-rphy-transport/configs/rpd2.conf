frr version 10.7
frr defaults traditional
hostname rpd2
service integrated-vtysh-config
!
interface lo
 description RPD-management-and-loopback-stand-in
 ip address 10.255.1.2/32
 ip ospf area 0
!
interface eth1
 description primary-transport-to-rpa1
 ip address 10.10.5.0/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description secondary-transport-to-rpa2
 ip address 10.10.5.2/31
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.1.2
!
