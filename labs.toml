# Lab registry: one entry per lab in this repository.
#
# This file is the single source of truth for lab identity. ./labctl reads it
# to list, check, deploy and destroy a lab. ./validate-repository.sh reads it
# to find the topologies it must check.
#
# Only standard TOML is used, so the driver needs nothing beyond the Python
# standard library. The static validator still uses PyYAML for full topology
# parsing; see requirements.txt.
#
# Schema and tailoring notes: docs/lifecycle.md
#
# Rules this file is checked against:
#   - every */<lab>.clab.yml in the repository has an entry here, and no entry
#     points at a topology that does not exist
#   - the topology's own `name:` matches the entry, so the clab-<name>- prefix
#     is predictable
#   - mgmt_subnet here matches the topology, and no two labs share one
#   - every image is pinned by tag or digest; `latest` is rejected

version = 1

# ---------------------------------------------------------------------------
# FRR labs. Direct containerlab deploy, no host kernel work.
# ---------------------------------------------------------------------------

[labs.ibgp-rr]
dir = "ibgp-rr"
topology = "ibgp-rr.clab.yml"
summary = "OSPF underlay, redundant iBGP route reflectors, ISP/customer eBGP edge, access-annex VLANs 120-122"
mgmt_subnet = "172.100.100.0/24"
images = ["quay.io/frrouting/frr:10.7.0", "alpine:3.20"]
verify = ["verify.sh"]


[labs.evpn-vxlan]
