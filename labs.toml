# ---------------------------------------------------------------------------
# netlab lab. Not deployed by containerlab, but it is part of the lab estate,
# so it belongs in the registry and in the drift checks.
# ---------------------------------------------------------------------------

[labs.enterprise-fabric]
dir = "enterprise-fabric"
topology = "topology.yml"
driver = "netlab"
summary = "Six-node SR Linux fabric: OSPF underlay, iBGP route reflectors, SSH/Ansible management, gNMI telemetry"
# Topology declares its management range in `addressing.mgmt.ipv4`, and the
# range collides with the Containerlab default. It must be reassigned before
# any deployment. No value here until that change is made.
mgmt_subnet = ""
# README documents `netlab validate`, but the repository holds no validation
# file, so that command has nothing to run. Add the file and list it here.
verify = []
# A small host is not a safe target
# for six network-OS nodes plus Telegraf, InfluxDB and Grafana.
min_free_memory_mb = 4096

[labs.evpn-vxlan-srlinux]
dir = "evpn-vxlan-srlinux"
topology = "topology.yml"
driver = "netlab"
summary = "Four-node SR Linux EVPN-VXLAN fabric, three segments, explicit VLAN to VNI binding in the committed config"
mgmt_subnet = "172.21.20.0/24"
# `netlab validate` runs the inline checks in topology.yml. There is no
# separate validation file to list here.
verify = []
# Four network-OS nodes plus three Linux hosts, so this refuses a 3 GB host.
min_free_memory_mb = 6144
