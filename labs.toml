# ---------------------------------------------------------------------------
# Campus lab. Two locally built images and a post-deploy radio attach.
# ---------------------------------------------------------------------------

[labs.evpn-vxlan-campus]
dir = "evpn-vxlan-campus"
topology = "evpn-vxlan-campus.clab.yml"
summary = "Two-site EVPN-VXLAN campus with NAC, DDI, firewall identity publication and reconciliation"
mgmt_subnet = "172.100.114.0/24"
images = ["quay.io/frrouting/frr:10.7.0", "alpine:3.20"]
verify = ["verify.sh", "verify-identity.sh"]
# The topology references both images, so both must be built before deploy.
# These tags must stay in step with evpn-vxlan-campus.clab.yml.
docker_builds = [
  { image = "campus-firewall:1.0.0", context = "firewall" },
  { image = "campus-identity:1.1.0", context = "identity" },
]
# The FRR nodes bind runtime/<node>:/var/run/frr and the daemons inside the
# image run as frr:frr (uid:gid 100:101). The driver creates one directory per
# such bind and applies this owner, so the daemons can write their pid files.
runtime_owner = "100:101"

[labs.evpn-vxlan-campus.hooks]
# Radios cannot be declared in a topology file. mac80211_hwsim creates its
# phys in the host namespace, so they are moved into the nodes afterwards.
post_deploy = [["identity/wireless-attach.sh"]]
pre_destroy = [["identity/wireless-detach.sh"]]

# ---------------------------------------------------------------------------
# Host-unsafe lab. Loads a kernel module and uses host networking, so it must
# run through the fixed automation templates on the shared host.
# ---------------------------------------------------------------------------

[labs.wireless-radius-8021x]
dir = "wireless-radius-8021x"
topology = "wireless-radius-8021x.clab.yml"
summary = "Virtual AP and supplicant over mac80211_hwsim, FreeRADIUS WPA2-Enterprise PEAP"
mgmt_subnet = "172.101.1.0/24"
images = [
  "freeradius/freeradius-server:3.2.7@sha256:42b05de4405b1e745686b9ed0f70307fd43e998b850b3e6bd936733a8c260595",
]
verify = ["verify.sh"]
docker_builds = [{ image = "wireless-lab-tools:1.0.0", context = "." }]

[labs.wireless-radius-8021x.hooks]
pre_deploy = [["lifecycle.sh", "pre-deploy"]]
post_deploy = [["lifecycle.sh", "post-deploy"]]
pre_destroy = [["lifecycle.sh", "pre-destroy"]]
post_destroy = [["lifecycle.sh", "post-destroy"]]

