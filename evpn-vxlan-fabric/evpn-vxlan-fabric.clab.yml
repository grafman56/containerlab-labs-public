      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/spine4.conf:/etc/frr/frr.conf
        - runtime/spine4:/var/run/frr
    leaf1:
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/leaf1.conf:/etc/frr/frr.conf
        - scripts/setup-leaf1.sh:/setup-leaf.sh:ro
        - runtime/leaf1:/var/run/frr
      exec:
        - bash /setup-leaf.sh
    leaf2:
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/daemons:/etc/frr/daemons
