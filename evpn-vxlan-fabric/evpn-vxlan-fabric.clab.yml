name: evpn-vxlan-fabric

mgmt:
  network: clab-evpn-vxlan-fabric
  ipv4-subnet: 172.100.111.0/24
  ipv6-subnet: 3fff:172:100:111::/64

topology:
  defaults:
    kind: linux

  nodes:
    spine1:
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/spine1.conf:/etc/frr/frr.conf
        - runtime/spine1:/var/run/frr
    spine2:
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/spine2.conf:/etc/frr/frr.conf
        - runtime/spine2:/var/run/frr
