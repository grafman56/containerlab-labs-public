frr version 10.7
frr defaults traditional
hostname spine4
service integrated-vtysh-config
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.255.0.0/16 le 32
ip prefix-list PL-LOOPBACKS seq 20 permit 10.255.255.0/24 le 32
!
route-map RM-UNDERLAY-IN permit 10
 match ip address prefix-list PL-LOOPBACKS
 set local-preference 150
!
interface lo
 ip address 10.255.255.4/32
!
interface eth1
 description to-leaf1
 ip address 10.104.1.0/31
!
interface eth2
 description to-leaf2
 ip address 10.104.2.0/31
!
interface eth3
 description to-leaf3
 ip address 10.104.3.0/31
!
interface eth4
 description to-leaf4
 ip address 10.104.4.0/31
!
interface eth5
 description to-leaf5
 ip address 10.104.5.0/31
!
interface eth6
 description to-leaf6
 ip address 10.104.6.0/31
!
interface eth7
 description to-leaf7
 ip address 10.104.7.0/31
!
interface eth8
 description to-leaf8
 ip address 10.104.8.0/31
!
interface eth9
 description to-leaf9
 ip address 10.104.9.0/31
!
interface eth10
 description to-leaf10
 ip address 10.104.10.0/31
!
router bgp 65000
 bgp router-id 10.255.255.4
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.104.1.1 remote-as 65101
 neighbor 10.104.2.1 remote-as 65102
 neighbor 10.104.3.1 remote-as 65103
 neighbor 10.104.4.1 remote-as 65104
 neighbor 10.104.5.1 remote-as 65105
 neighbor 10.104.6.1 remote-as 65106
 neighbor 10.104.7.1 remote-as 65107
 neighbor 10.104.8.1 remote-as 65108
 neighbor 10.104.9.1 remote-as 65109
 neighbor 10.104.10.1 remote-as 65110
 neighbor 10.255.0.1 remote-as 65101
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.1 ebgp-multihop 3
 neighbor 10.255.0.1 disable-connected-check
 neighbor 10.255.0.2 remote-as 65102
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.2 ebgp-multihop 3
 neighbor 10.255.0.2 disable-connected-check
 neighbor 10.255.0.3 remote-as 65103
 neighbor 10.255.0.3 update-source lo
 neighbor 10.255.0.3 ebgp-multihop 3
 neighbor 10.255.0.3 disable-connected-check
 neighbor 10.255.0.4 remote-as 65104
 neighbor 10.255.0.4 update-source lo
 neighbor 10.255.0.4 ebgp-multihop 3
 neighbor 10.255.0.4 disable-connected-check
 neighbor 10.255.0.5 remote-as 65105
 neighbor 10.255.0.5 update-source lo
 neighbor 10.255.0.5 ebgp-multihop 3
 neighbor 10.255.0.5 disable-connected-check
 neighbor 10.255.0.6 remote-as 65106
 neighbor 10.255.0.6 update-source lo
 neighbor 10.255.0.6 ebgp-multihop 3
 neighbor 10.255.0.6 disable-connected-check
 neighbor 10.255.0.7 remote-as 65107
 neighbor 10.255.0.7 update-source lo
 neighbor 10.255.0.7 ebgp-multihop 3
 neighbor 10.255.0.7 disable-connected-check
 neighbor 10.255.0.8 remote-as 65108
 neighbor 10.255.0.8 update-source lo
 neighbor 10.255.0.8 ebgp-multihop 3
 neighbor 10.255.0.8 disable-connected-check
 neighbor 10.255.0.9 remote-as 65109
 neighbor 10.255.0.9 update-source lo
 neighbor 10.255.0.9 ebgp-multihop 3
 neighbor 10.255.0.9 disable-connected-check
 neighbor 10.255.0.10 remote-as 65110
 neighbor 10.255.0.10 update-source lo
 neighbor 10.255.0.10 ebgp-multihop 3
 neighbor 10.255.0.10 disable-connected-check
 !
 address-family ipv4 unicast
  neighbor 10.104.1.1 activate
  neighbor 10.104.1.1 route-map RM-UNDERLAY-IN in
  neighbor 10.104.2.1 activate
  neighbor 10.104.2.1 route-map RM-UNDERLAY-IN in
  neighbor 10.104.3.1 activate
  neighbor 10.104.3.1 route-map RM-UNDERLAY-IN in
  neighbor 10.104.4.1 activate
  neighbor 10.104.4.1 route-map RM-UNDERLAY-IN in
  neighbor 10.104.5.1 activate
  neighbor 10.104.5.1 route-map RM-UNDERLAY-IN in
  neighbor 10.104.6.1 activate
  neighbor 10.104.6.1 route-map RM-UNDERLAY-IN in
  neighbor 10.104.7.1 activate
  neighbor 10.104.7.1 route-map RM-UNDERLAY-IN in
  neighbor 10.104.8.1 activate
  neighbor 10.104.8.1 route-map RM-UNDERLAY-IN in
  neighbor 10.104.9.1 activate
  neighbor 10.104.9.1 route-map RM-UNDERLAY-IN in
  neighbor 10.104.10.1 activate
  neighbor 10.104.10.1 route-map RM-UNDERLAY-IN in
  network 10.255.255.4/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.5 activate
  neighbor 10.255.0.6 activate
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.8 activate
  neighbor 10.255.0.9 activate
  neighbor 10.255.0.10 activate
 exit-address-family
!
