frr version 10.7
frr defaults traditional
hostname leaf5
service integrated-vtysh-config
!
ip access-list extended ACL-TENANT-A
 permit ip 10.10.10.0/24 any
 permit ip 10.20.20.0/24 any
 deny ip any any
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.255.0.0/16 le 32
ip prefix-list PL-LOOPBACKS seq 20 permit 10.255.255.0/24 le 32
!
route-map RM-UNDERLAY-IN permit 10
 match ip address prefix-list PL-LOOPBACKS
 set local-preference 150
!
route-map RM-TENANT-A-IN permit 10
 match ip address ACL-TENANT-A
!
vrf TENANT-A
 vni 4100
!
interface lo
 ip address 10.255.0.5/32
!
interface eth1
 description to-spine1
 ip address 10.101.5.1/31
!
interface eth2
 description to-spine2
 ip address 10.102.5.1/31
!
interface eth3
 description to-spine3
 ip address 10.103.5.1/31
!
interface eth4
 description to-spine4
 ip address 10.104.5.1/31
!
interface br10 vrf TENANT-A
 description VNI1010-SVI-TENANT-A
 ip address 10.10.10.1/24
!
router bgp 65105
 bgp router-id 10.255.0.5
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.101.5.0 remote-as 65000
 neighbor 10.102.5.0 remote-as 65000
 neighbor 10.103.5.0 remote-as 65000
 neighbor 10.104.5.0 remote-as 65000
 neighbor 10.255.255.1 remote-as 65000
 neighbor 10.255.255.1 update-source lo
 neighbor 10.255.255.1 ebgp-multihop 3
 neighbor 10.255.255.1 disable-connected-check
 neighbor 10.255.255.2 remote-as 65000
 neighbor 10.255.255.2 update-source lo
 neighbor 10.255.255.2 ebgp-multihop 3
 neighbor 10.255.255.2 disable-connected-check
 neighbor 10.255.255.3 remote-as 65000
 neighbor 10.255.255.3 update-source lo
 neighbor 10.255.255.3 ebgp-multihop 3
 neighbor 10.255.255.3 disable-connected-check
 neighbor 10.255.255.4 remote-as 65000
 neighbor 10.255.255.4 update-source lo
 neighbor 10.255.255.4 ebgp-multihop 3
 neighbor 10.255.255.4 disable-connected-check
 !
 address-family ipv4 unicast
  neighbor 10.101.5.0 activate
  neighbor 10.101.5.0 route-map RM-UNDERLAY-IN in
  neighbor 10.102.5.0 activate
  neighbor 10.102.5.0 route-map RM-UNDERLAY-IN in
  neighbor 10.103.5.0 activate
  neighbor 10.103.5.0 route-map RM-UNDERLAY-IN in
  neighbor 10.104.5.0 activate
  neighbor 10.104.5.0 route-map RM-UNDERLAY-IN in
  network 10.255.0.5/32
  maximum-paths 4
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.255.255.1 activate
  neighbor 10.255.255.2 activate
  neighbor 10.255.255.3 activate
  neighbor 10.255.255.4 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65105 vrf TENANT-A
 !
 address-family ipv4 unicast
  redistribute connected route-map RM-TENANT-A-IN
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
