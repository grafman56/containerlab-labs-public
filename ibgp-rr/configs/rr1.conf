frr version 10.7
frr defaults traditional
hostname rr1
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.11/32
 ip ospf area 0
!
interface eth1
 description to-rr2
 ip address 10.1.11.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description to-p1
 ip address 10.1.1.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth3
 description to-p2
 ip address 10.1.2.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth4
 description to-p3
 ip address 10.1.3.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.0.0.11
!
router bgp 65000
 bgp router-id 10.0.0.11
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as 65000
 neighbor RR update-source lo
 neighbor CLIENT peer-group
 neighbor CLIENT remote-as 65000
 neighbor CLIENT update-source lo
 neighbor 10.0.0.12 peer-group RR
 neighbor 10.0.0.1 peer-group CLIENT
 neighbor 10.0.0.2 peer-group CLIENT
 neighbor 10.0.0.3 peer-group CLIENT
 !
 address-family ipv4 unicast
  neighbor RR activate
  neighbor CLIENT activate
  neighbor CLIENT route-reflector-client
 exit-address-family
!
