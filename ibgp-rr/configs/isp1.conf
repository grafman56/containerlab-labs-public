frr version 10.7
frr defaults traditional
hostname isp1
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.254/32
!
interface eth1
 description to-e1-customer
 ip address 198.51.100.1/30
!
ip route 0.0.0.0/0 blackhole
!
router bgp 64500
 bgp router-id 10.0.0.254
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 198.51.100.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 default-originate
  neighbor 198.51.100.2 route-map CUSTOMER-IN in
 exit-address-family
!
ip prefix-list CUSTOMER-PUBLIC seq 5 permit 203.0.113.0/24
!
route-map CUSTOMER-IN permit 10
 match ip address prefix-list CUSTOMER-PUBLIC
!
