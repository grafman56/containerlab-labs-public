frr version 10.7
frr defaults traditional
hostname p1
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
 ip ospf area 0
!
interface eth1
 description to-rr1
 ip address 10.1.1.2/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description to-rr2
 ip address 10.1.4.2/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth3
 description to-e1
 ip address 172.16.1.1/30
!
router ospf
 ospf router-id 10.0.0.1
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.0.11 remote-as 65000
 neighbor 10.0.0.11 update-source lo
 neighbor 10.0.0.12 remote-as 65000
 neighbor 10.0.0.12 update-source lo
 neighbor 172.16.1.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 10.0.0.11 activate
  neighbor 10.0.0.11 next-hop-self
  neighbor 10.0.0.12 activate
  neighbor 10.0.0.12 next-hop-self
  neighbor 172.16.1.2 activate
 exit-address-family
!
