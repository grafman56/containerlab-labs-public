frr version 10.7
frr defaults traditional
hostname e1
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.21/32
!
interface eth1
 description to-p1
 ip address 172.16.1.2/30
!
interface eth2
 description to-isp1
 ip address 198.51.100.2/30
!
ip route 203.0.113.0/24 blackhole
!
router bgp 65001
 bgp router-id 10.0.0.21
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 172.16.1.1 remote-as 65000
 neighbor 198.51.100.1 remote-as 64500
 !
 address-family ipv4 unicast
  neighbor 172.16.1.1 activate
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.1 route-map ISP-IN in
  neighbor 198.51.100.1 route-map ISP-OUT out
  network 203.0.113.0/24 route-map SET-COMM
 exit-address-family
!
route-map SET-COMM permit 10
 set community 65001:100

ip prefix-list ISP-DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list CUSTOMER-PUBLIC seq 5 permit 203.0.113.0/24

route-map ISP-IN permit 10
 match ip address prefix-list ISP-DEFAULT

route-map ISP-OUT permit 10
 match ip address prefix-list CUSTOMER-PUBLIC
!
