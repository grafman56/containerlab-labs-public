name: ibgp-rr

# Explicit mgmt subnet: containerlab's default 172.20.20.0/24 can overlap other
# Docker networks on the host. 172.100.100.0/24 is well clear of the usual
# Docker ranges (172.17.0.0/16 - 172.25.0.0/16).
mgmt:
  network: clab-ibgp-rr
  ipv4-subnet: 172.100.100.0/24
  ipv6-subnet: 3fff:172:100:100::/64

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.7.0

  nodes:
    rr1:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/rr1.conf:/etc/frr/frr.conf
        - runtime/rr1:/var/run/frr
    rr2:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/rr2.conf:/etc/frr/frr.conf
        - runtime/rr2:/var/run/frr
    p1:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/p1.conf:/etc/frr/frr.conf
        - runtime/p1:/var/run/frr
    p2:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/p2.conf:/etc/frr/frr.conf
        - runtime/p2:/var/run/frr
    p3:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/p3.conf:/etc/frr/frr.conf
        - runtime/p3:/var/run/frr
    e1:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/e1.conf:/etc/frr/frr.conf
        - runtime/e1:/var/run/frr
    isp1:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/isp1.conf:/etc/frr/frr.conf
        - runtime/isp1:/var/run/frr
    sw1:
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - scripts/setup-access-switch.sh:/setup-access-switch.sh:ro
      exec:
        - bash /setup-access-switch.sh eth2 eth1 eth3 eth4
    sw2:
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - scripts/setup-access-switch.sh:/setup-access-switch.sh:ro
      exec:
        - bash /setup-access-switch.sh eth1 eth2 eth3 eth4
    client1:
      image: alpine:3.20
      cmd: sleep infinity
      exec:
        - ip link set eth1 up
        - ip address add 10.120.0.11/24 dev eth1
    client2:
      image: alpine:3.20
      cmd: sleep infinity
      exec:
        - ip link set eth1 up
        - ip address add 10.120.0.12/24 dev eth1
    client3:
      image: alpine:3.20
      cmd: sleep infinity
      exec:
        - ip link set eth1 up
        - ip address add 10.121.0.11/24 dev eth1
    client4:
      image: alpine:3.20
      cmd: sleep infinity
      exec:
        - ip link set eth1 up
        - ip address add 10.121.0.12/24 dev eth1
    client5:
      image: alpine:3.20
      cmd: sleep infinity
      exec:
        - ip link set eth1 up
        - ip address add 10.122.0.11/24 dev eth1
    client6:
      image: alpine:3.20
      cmd: sleep infinity
      exec:
        - ip link set eth1 up
        - ip address add 10.122.0.12/24 dev eth1

  links:
    - endpoints: ["rr1:eth1", "rr2:eth1"]
    - endpoints: ["rr1:eth2", "p1:eth1"]
    - endpoints: ["rr1:eth3", "p2:eth1"]
    - endpoints: ["rr1:eth4", "p3:eth1"]
    - endpoints: ["rr2:eth2", "p1:eth2"]
    - endpoints: ["rr2:eth3", "p2:eth2"]
    - endpoints: ["rr2:eth4", "p3:eth2"]
    - endpoints: ["p2:eth3", "p3:eth3"]
    - endpoints: ["p1:eth3", "e1:eth1"]
    - endpoints: ["e1:eth2", "isp1:eth1"]
    - endpoints: ["sw1:eth1", "client1:eth1"]
    - endpoints: ["sw1:eth2", "sw2:eth1"]
    - endpoints: ["sw2:eth2", "client2:eth1"]
    - endpoints: ["sw1:eth3", "client3:eth1"]
    - endpoints: ["sw2:eth3", "client4:eth1"]
    - endpoints: ["sw1:eth4", "client5:eth1"]
    - endpoints: ["sw2:eth4", "client6:eth1"]
