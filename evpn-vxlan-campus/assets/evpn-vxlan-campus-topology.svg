  <text x="48" y="828" class="legend"><tspan fill="#fbbf24">&#9670;</tspan> Eight VTEPs form the EVPN mesh. Spines route OSPF underlay only in this full-mesh example; other designs use spines as EVPN route reflectors.</text>
  <text x="48" y="852" class="legend">The ABR at each building is the area boundary. Bldg A1 has no provider of its own, so it is totally stubby: 3 LSAs and a single default. Bldg B1 has its own research circuit, which makes acc-b1 an ASBR and rules out a stub area entirely. Its type 7 becomes a type 5 at the ABR, and area 1 never sees it.</text>
