  <text x="72" y="963" class="campus">CAMPUS A · WIRELESS AND IDENTITY EDGE · 8 MORE NODES</text>
  <text x="72" y="985" class="caption">Two leaves per site (four total). The AP and wired edge carry authenticated clients into VLAN 10 or 30; identity services attach to leaf2a.</text>
