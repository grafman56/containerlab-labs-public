<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="1200" viewBox="0 0 1940 1200" role="img" aria-labelledby="title desc">
  <title id="title">Two-site campus network: an EVPN-VXLAN fabric in OSPF area 0 with non-fabric buildings in their own areas</title>
  <desc id="desc">Thirty-five-node topology. Each site has two spines, two access leaves, and two border leaves. Each border leaf connects to both local spines and the site's firewall. Eight VTEPs form a full iBGP EVPN mesh in AS 65000 over the OSPFv2 area 0 underlay. Campus A also has an identity edge, wireless AP and clients, ClearPass and eduroam RADIUS stand-ins, a remote IdP, and BlueCat DDI stand-in.</desc>
