frr version 10.7
frr defaults traditional
hostname acc-b1
service integrated-vtysh-config
!
ip prefix-list PL-RESEARCH-IN seq 10 permit 203.0.113.3/32
ip prefix-list PL-RESEARCH-IN seq 100 deny 0.0.0.0/0 le 32
!
route-map RM-BGP-TO-OSPF permit 10
 match ip address prefix-list PL-RESEARCH-IN
!
route-map RM-BGP-TO-OSPF deny 100
!
interface eth1
 description to-dist-b1 (area 2)
 ip address 10.0.4.5/31
 ip ospf network point-to-point
!
interface eth2
 description building-B1-users
 ip address 10.102.10.1/24
!
interface eth3
 description research circuit, this building's own provider
 ip address 198.51.100.8/31
!
interface lo
 ip address 10.255.3.2/32
!
! This building has its own provider, so routes enter OSPF here, inside the
! area. That makes acc-b1 an ASBR, and an ASBR is exactly what a stub or
! totally stubby area forbids. NSSA is not a preference here, it is forced.
router bgp 65000
 bgp router-id 10.255.3.2
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 198.51.100.9 remote-as 65400
 !
 address-family ipv4 unicast
  neighbor 198.51.100.9 activate
  redistribute ospf
 exit-address-family
!
router ospf
 ospf router-id 10.255.3.2
 network 10.0.4.4/31 area 2
 network 10.255.3.2/32 area 2
 network 10.102.10.0/24 area 2
 area 2 nssa
 ! Carries the research network into the campus as a type 7. Deliberately not
 ! a default: this circuit is for reaching that network, not general egress.
 redistribute bgp route-map RM-BGP-TO-OSPF
!
