frr version 10.7
frr defaults traditional
hostname spine1a
service integrated-vtysh-config
!
interface lo
 ip address 10.255.255.1/32
!
interface eth1
 description to-leaf1a
 ip address 10.0.0.0/31
 ip ospf network point-to-point
!
interface eth2
 description to-leaf2a
 ip address 10.0.0.2/31
 ip ospf network point-to-point
!
interface eth3
 description to-bdr-a-primary
 ip address 10.0.0.8/31
 ip ospf network point-to-point
!
interface eth4
 description to-dist-a1
 ip address 10.0.3.0/31
 ip ospf network point-to-point
!
interface eth5
 description to-fw-a
 ip address 10.0.5.0/31
 ip ospf network point-to-point
!
interface eth6
 description to-bdr-a2
 ip address 10.0.0.12/31
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.255.1
 network 10.0.0.0/8 area 0
!
