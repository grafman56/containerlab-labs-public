frr version 10.7
frr defaults traditional
hostname spine1b
service integrated-vtysh-config
!
interface lo
 ip address 10.255.255.3/32
!
interface eth1
 description to-leaf1b
 ip address 10.0.1.0/31
 ip ospf network point-to-point
!
interface eth2
 description to-leaf2b
 ip address 10.0.1.2/31
 ip ospf network point-to-point
!
interface eth3
 description to-bdr-b-primary
 ip address 10.0.1.8/31
 ip ospf network point-to-point
!
interface eth4
 description dci-to-spine2a
 ip address 10.0.2.1/31
 ip ospf network point-to-point
!
interface eth5
 description to-dist-b1
 ip address 10.0.4.0/31
 ip ospf network point-to-point
!
interface eth6
 description to-fw-b
 ip address 10.0.5.2/31
 ip ospf network point-to-point
!
interface eth7
 description to-bdr-b2
 ip address 10.0.1.12/31
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.255.3
 network 10.0.0.0/8 area 0
!
