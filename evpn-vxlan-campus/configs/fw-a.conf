frr version 10.7
frr defaults traditional
hostname fw-a
service integrated-vtysh-config
!
! The tenant side gets a default and nothing else. A real PAN-OS box enforces
! this with zones and security policy; FRR has none, so the filter stands in
! for it. Treat this node as the firewall's routing plane only.
ip prefix-list PL-DEFAULT-ONLY seq 10 permit 0.0.0.0/0
ip prefix-list PL-DEFAULT-ONLY seq 100 deny 0.0.0.0/0 le 32
!
interface lo
 ip address 10.255.4.1/32
!
interface eth1
 description to-border (campus zone)
 ip address 198.51.100.1/31
!
! One subinterface per security zone, and -- this part matters -- a separate
! VRF per zone on the firewall itself.
!
! The first version of this lab left both zones in one routing table here,
! reasoning that the fabric already kept them apart. It does: the EDUROAM VRF
! on the leaf has no route to campus at all. But the visitor default points at
! this box, and this box had routes into BOTH zones, so it cheerfully
! forwarded between them. A visitor could reach the campus services subnet
! even though no leaf anywhere held a route for it.
!
! VRF SEPARATION ON THE FABRIC IS NOT ISOLATION IF A SHARED FIREWALL HOLDS
! BOTH ROUTES AND HAS NO POLICY. On a real Palo Alto the zones exist and the
! absence of an inter-zone rule is what stops this. FRR has no policy engine,
! so the equivalent is one VRF per zone and no leaking between them.
!
! verify-identity.sh now asserts end-to-end unreachability, not merely the
! absence of a route on one leaf. The weaker assertion passed while the leak
! was live, which is its own lesson about what a test is worth.
vrf ZONE-EDUROAM
!
interface eth1.30 vrf ZONE-EDUROAM
 description to-border (eduroam zone)
 ip address 198.51.100.11/31
!
interface eth2.30 vrf ZONE-EDUROAM
 description to-isp (eduroam zone)
 ip address 198.51.100.12/31
!
interface eth2
 description to-isp (internet side)
 ip address 198.51.100.4/31
!
interface eth3
 description to-core (campus side, area 0)
 ip address 10.0.5.1/31
 ip ospf network point-to-point
!
interface eth4
 description to-border-a2 (campus zone)
 ip address 198.51.100.17/31
!
interface eth4.30 vrf ZONE-EDUROAM
 description to-border-a2 (eduroam zone)
 ip address 198.51.100.19/31
!
router ospf
 ospf router-id 10.255.4.1
 network 10.0.5.0/31 area 0
 network 10.255.4.1/32 area 0
 ! Originates the ISP default into OSPF as a type 5. No "always": if the
 ! circuit drops the external withdraws, which is the whole point.
 default-information originate
!
router bgp 65301
 bgp router-id 10.255.4.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 198.51.100.0 remote-as 65000
 neighbor 198.51.100.16 remote-as 65000
 neighbor 198.51.100.5 remote-as 65100
 !
 address-family ipv4 unicast
  neighbor 198.51.100.0 activate
  neighbor 198.51.100.0 default-originate
  neighbor 198.51.100.0 prefix-list PL-DEFAULT-ONLY out
  neighbor 198.51.100.16 activate
  neighbor 198.51.100.16 default-originate
  neighbor 198.51.100.16 prefix-list PL-DEFAULT-ONLY out
  neighbor 198.51.100.5 activate
  redistribute ospf
  redistribute connected
 exit-address-family
!
! The visitor zone's own routing table. It peers with the border on one side
! and the ISP on the other, and holds no campus routes at all -- there is
! nothing here to leak, which is the point.
router bgp 65301 vrf ZONE-EDUROAM
 bgp router-id 10.255.4.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 198.51.100.10 remote-as 65000
 neighbor 198.51.100.18 remote-as 65000
 neighbor 198.51.100.13 remote-as 65100
 !
 address-family ipv4 unicast
  neighbor 198.51.100.10 activate
  neighbor 198.51.100.10 default-originate
  neighbor 198.51.100.10 prefix-list PL-DEFAULT-ONLY out
  neighbor 198.51.100.18 activate
  neighbor 198.51.100.18 default-originate
  neighbor 198.51.100.18 prefix-list PL-DEFAULT-ONLY out
  neighbor 198.51.100.13 activate
 exit-address-family
!
