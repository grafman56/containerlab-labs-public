frr version 10.7
frr defaults traditional
hostname acc-a1
service integrated-vtysh-config
!
interface eth1
 description to-dist-a1 (area 1)
 ip address 10.0.3.5/31
 ip ospf network point-to-point
!
interface eth2
 description building-A1-users
 ip address 10.101.10.1/24
!
interface lo
 ip address 10.255.2.2/32
!
router ospf
 ospf router-id 10.255.2.2
 network 10.0.3.4/31 area 1
 network 10.255.2.2/32 area 1
 network 10.101.10.0/24 area 1
 area 1 stub
!
