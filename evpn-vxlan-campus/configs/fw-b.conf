frr version 10.7
frr defaults traditional
hostname fw-b
service integrated-vtysh-config
!
! The tenant side gets a default and nothing else. A real PAN-OS box enforces
! this with zones and security policy; FRR has none, so the filter stands in
! for it. Treat this node as the firewall's routing plane only.
ip prefix-list PL-DEFAULT-ONLY seq 10 permit 0.0.0.0/0
ip prefix-list PL-DEFAULT-ONLY seq 100 deny 0.0.0.0/0 le 32
!
interface lo
 ip address 10.255.4.2/32
!
interface eth1
 description to-border (DC tenant side)
 ip address 198.51.100.3/31
!
interface eth2
 description to-isp (internet side)
 ip address 198.51.100.6/31
!
interface eth3
 description to-core (campus side, area 0)
 ip address 10.0.5.3/31
 ip ospf network point-to-point
!
interface eth4
 description to-border-b2
 ip address 198.51.100.21/31
!
router ospf
 ospf router-id 10.255.4.2
 network 10.0.5.2/31 area 0
 network 10.255.4.2/32 area 0
 ! Originates the ISP default into OSPF as a type 5. No "always": if the
 ! circuit drops the external withdraws, which is the whole point.
 default-information originate
!
router bgp 65302
 bgp router-id 10.255.4.2
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 198.51.100.2 remote-as 65000
 neighbor 198.51.100.20 remote-as 65000
 neighbor 198.51.100.7 remote-as 65200
 !
 address-family ipv4 unicast
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 default-originate
  neighbor 198.51.100.2 prefix-list PL-DEFAULT-ONLY out
  neighbor 198.51.100.20 activate
  neighbor 198.51.100.20 default-originate
  neighbor 198.51.100.20 prefix-list PL-DEFAULT-ONLY out
  neighbor 198.51.100.7 activate
  redistribute ospf
  redistribute connected
 exit-address-family
!
