frr version 10.7
frr defaults traditional
hostname inet-a
service integrated-vtysh-config
!
interface lo
 ip address 203.0.113.1/32
!
interface eth1
 description to-firewall (campus zone)
 ip address 198.51.100.5/31
!
! The visitor zone reaches the internet without ever sharing a routing table
! with campus. Same physical ISP, separate logical hand-off.
interface eth1.30
 description to-firewall (eduroam zone)
 ip address 198.51.100.13/31
!
router bgp 65100
 bgp router-id 203.0.113.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 198.51.100.4 remote-as 65301
 neighbor 198.51.100.12 remote-as 65301
 !
 address-family ipv4 unicast
  neighbor 198.51.100.4 activate
  neighbor 198.51.100.4 default-originate
  neighbor 198.51.100.12 activate
  neighbor 198.51.100.12 default-originate
  network 203.0.113.1/32
 exit-address-family
!
