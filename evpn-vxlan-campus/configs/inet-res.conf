frr version 10.7
frr defaults traditional
hostname inet-res
service integrated-vtysh-config
!
interface lo
 ip address 203.0.113.3/32
!
interface eth1
 description to-acc-b1
 ip address 198.51.100.9/31
!
router bgp 65400
 bgp router-id 203.0.113.3
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 198.51.100.8 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 198.51.100.8 activate
  network 203.0.113.3/32
 exit-address-family
!
