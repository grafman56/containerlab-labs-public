frr version 10.7
frr defaults traditional
hostname bdr-a2
service integrated-vtysh-config
!
ip prefix-list PL-TO-FW-TENANT-A seq 10 permit 10.10.10.0/24
ip prefix-list PL-TO-FW-TENANT-A seq 20 permit 10.20.20.0/24
ip prefix-list PL-TO-FW-TENANT-A seq 100 deny 0.0.0.0/0 le 32
ip prefix-list PL-TO-FW-EDUROAM seq 10 permit 10.30.30.0/24
ip prefix-list PL-TO-FW-EDUROAM seq 100 deny 0.0.0.0/0 le 32
ip prefix-list PL-FROM-FW-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-FROM-FW-DEFAULT seq 100 deny 0.0.0.0/0 le 32
!
route-map RM-TO-FW-TENANT-A permit 10
 match ip address prefix-list PL-TO-FW-TENANT-A
 set community 65000:110 additive
!
route-map RM-TO-FW-EDUROAM permit 10
 match ip address prefix-list PL-TO-FW-EDUROAM
 set community 65000:130 additive
!
route-map RM-FROM-FW-DEFAULT permit 10
 match ip address prefix-list PL-FROM-FW-DEFAULT
!
route-map RM-FROM-FW-DEFAULT deny 100
!
vrf TENANT-A
 vni 4100
!
vrf EDUROAM
 vni 4200
!
interface br4100 vrf TENANT-A
 description L3VNI-4100-SVI
!
interface br4200 vrf EDUROAM
 description L3VNI-4200-SVI
!
interface lo
 ip address 10.255.1.3/32
!
interface eth1
 description to-spine1a
 ip address 10.0.0.13/31
 ip ospf network point-to-point
!
interface eth2
 description to-spine2a
 ip address 10.0.0.15/31
 ip ospf network point-to-point
!
interface eth3 vrf TENANT-A
 description to-firewall (campus zone)
 ip address 198.51.100.16/31
!
interface eth3.30 vrf EDUROAM
 description to-firewall (eduroam zone)
 ip address 198.51.100.18/31
!
router ospf
 ospf router-id 10.255.1.3
 network 10.0.0.0/8 area 0
!
router bgp 65000
 bgp router-id 10.255.1.3
 no bgp default ipv4-unicast
 neighbor EVPN peer-group
 neighbor EVPN remote-as 65000
 neighbor EVPN update-source lo
 neighbor 10.255.0.1 peer-group EVPN
 neighbor 10.255.0.2 peer-group EVPN
 neighbor 10.255.0.3 peer-group EVPN
 neighbor 10.255.0.4 peer-group EVPN
 neighbor 10.255.1.1 peer-group EVPN
 neighbor 10.255.1.2 peer-group EVPN
 neighbor 10.255.1.4 peer-group EVPN
 !
 address-family l2vpn evpn
  neighbor EVPN activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf TENANT-A
 bgp router-id 10.255.1.3
 no bgp ebgp-requires-policy
 neighbor 198.51.100.17 remote-as 65301
 !
 address-family ipv4 unicast
  neighbor 198.51.100.17 activate
  neighbor 198.51.100.17 route-map RM-FROM-FW-DEFAULT in
  neighbor 198.51.100.17 route-map RM-TO-FW-TENANT-A out
  neighbor 198.51.100.17 send-community
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 65000 vrf EDUROAM
 bgp router-id 10.255.1.3
 no bgp ebgp-requires-policy
 neighbor 198.51.100.19 remote-as 65301
 !
 address-family ipv4 unicast
  neighbor 198.51.100.19 activate
  neighbor 198.51.100.19 route-map RM-FROM-FW-DEFAULT in
  neighbor 198.51.100.19 route-map RM-TO-FW-EDUROAM out
  neighbor 198.51.100.19 send-community
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
