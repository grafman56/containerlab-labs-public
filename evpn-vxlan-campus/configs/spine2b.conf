frr version 10.7
frr defaults traditional
hostname spine2b
service integrated-vtysh-config
!
interface lo
 ip address 10.255.255.4/32
!
interface eth1
 description to-leaf1b
 ip address 10.0.1.4/31
 ip ospf network point-to-point
!
interface eth2
 description to-leaf2b
 ip address 10.0.1.6/31
 ip ospf network point-to-point
!
interface eth3
 description to-bdr-b-primary
 ip address 10.0.1.10/31
 ip ospf network point-to-point
!
interface eth4
 description to-dist-b1
 ip address 10.0.4.2/31
 ip ospf network point-to-point
!
interface eth5
 description to-bdr-b2
 ip address 10.0.1.14/31
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.255.4
 network 10.0.0.0/8 area 0
!
