frr version 10.7
frr defaults traditional
hostname leaf1b
service integrated-vtysh-config
!
route-map RM-PREFER-LOCAL-EXIT permit 10
 set local-preference 200
!
route-map RM-PREFER-SECONDARY-EXIT permit 10
 set local-preference 190
!
! Prefer this site's primary border, then its secondary, then the far site.
vrf TENANT-A
 vni 4100
!
interface br4100 vrf TENANT-A
 description L3VNI-4100-SVI
!
interface lo
 ip address 10.255.0.3/32
!
interface eth1
 description to-spine1
 ip address 10.0.1.1/31
 ip ospf network point-to-point
!
interface eth2
 description to-spine2
 ip address 10.0.1.5/31
 ip ospf network point-to-point
!
interface br10 vrf TENANT-A
 description VNI1010-anycast-gateway
 ip address 10.10.10.1/24
!
interface br20 vrf TENANT-A
 description VNI1020-anycast-gateway
 ip address 10.20.20.1/24
!
router ospf
 ospf router-id 10.255.0.3
 network 10.0.0.0/8 area 0
!
router bgp 65000
 bgp router-id 10.255.0.3
 no bgp default ipv4-unicast
 neighbor EVPN peer-group
 neighbor EVPN remote-as 65000
 neighbor EVPN update-source lo
 neighbor 10.255.0.1 peer-group EVPN
 neighbor 10.255.0.2 peer-group EVPN
 neighbor 10.255.0.4 peer-group EVPN
 neighbor 10.255.1.1 peer-group EVPN
 neighbor 10.255.1.2 peer-group EVPN
 neighbor 10.255.1.3 peer-group EVPN
 neighbor 10.255.1.4 peer-group EVPN
 !
 address-family l2vpn evpn
  neighbor EVPN activate
  neighbor 10.255.1.2 route-map RM-PREFER-LOCAL-EXIT in
  neighbor 10.255.1.4 route-map RM-PREFER-SECONDARY-EXIT in
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf TENANT-A
 bgp router-id 10.255.0.3
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
