frr version 10.7
frr defaults traditional
hostname dist-a1
service integrated-vtysh-config
!
interface eth1
 description to-spine1a (area 0)
 ip address 10.0.3.1/31
 ip ospf network point-to-point
!
interface eth2
 description to-spine2a (area 0)
 ip address 10.0.3.3/31
 ip ospf network point-to-point
!
interface eth3
 description to-acc-a1 (area 1)
 ip address 10.0.3.4/31
 ip ospf network point-to-point
!
interface lo
 ip address 10.255.2.1/32
!
router ospf
 ospf router-id 10.255.2.1
 network 10.0.3.0/31 area 0
 network 10.0.3.2/31 area 0
 network 10.255.2.1/32 area 0
 network 10.0.3.4/31 area 1
 area 1 stub no-summary
!
