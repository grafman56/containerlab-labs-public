frr version 10.7
frr defaults traditional
hostname dist-b1
service integrated-vtysh-config
!
interface eth1
 description to-spine1b (area 0)
 ip address 10.0.4.1/31
 ip ospf network point-to-point
!
interface eth2
 description to-spine2b (area 0)
 ip address 10.0.4.3/31
 ip ospf network point-to-point
!
interface eth3
 description to-acc-b1 (area 2)
 ip address 10.0.4.4/31
 ip ospf network point-to-point
!
interface lo
 ip address 10.255.3.1/32
!
router ospf
 ospf router-id 10.255.3.1
 network 10.0.4.0/31 area 0
 network 10.0.4.2/31 area 0
 network 10.255.3.1/32 area 0
 network 10.0.4.4/31 area 2
 area 2 nssa
!
