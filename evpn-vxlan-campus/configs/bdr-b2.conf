frr version 10.7
frr defaults traditional
hostname bdr-b2
service integrated-vtysh-config
!
ip prefix-list PL-TO-FW-TENANT-A seq 10 permit 10.10.10.0/24
ip prefix-list PL-TO-FW-TENANT-A seq 20 permit 10.20.20.0/24
ip prefix-list PL-TO-FW-TENANT-A seq 100 deny 0.0.0.0/0 le 32
ip prefix-list PL-FROM-FW-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-FROM-FW-DEFAULT seq 100 deny 0.0.0.0/0 le 32
!
route-map RM-TO-FW-TENANT-A permit 10
 match ip address prefix-list PL-TO-FW-TENANT-A
 set community 65000:110 additive
!
route-map RM-FROM-FW-DEFAULT permit 10
 match ip address prefix-list PL-FROM-FW-DEFAULT
!
route-map RM-FROM-FW-DEFAULT deny 100
!
vrf TENANT-A
 vni 4100
!
interface br4100 vrf TENANT-A
 description L3VNI-4100-SVI
!
interface lo
 ip address 10.255.1.4/32
!
interface eth1
 description to-spine1b
 ip address 10.0.1.13/31
 ip ospf network point-to-point
!
interface eth2
 description to-spine2b
 ip address 10.0.1.15/31
 ip ospf network point-to-point
!
interface eth3 vrf TENANT-A
 description to-firewall
 ip address 198.51.100.20/31
!
router ospf
 ospf router-id 10.255.1.4
 network 10.0.0.0/8 area 0
!
router bgp 65000
 bgp router-id 10.255.1.4
 no bgp default ipv4-unicast
 neighbor EVPN peer-group
 neighbor EVPN remote-as 65000
 neighbor EVPN update-source lo
 neighbor 10.255.0.1 peer-group EVPN
 neighbor 10.255.0.2 peer-group EVPN
 neighbor 10.255.0.3 peer-group EVPN
 neighbor 10.255.0.4 peer-group EVPN
 neighbor 10.255.1.1 peer-group EVPN
 neighbor 10.255.1.2 peer-group EVPN
 neighbor 10.255.1.3 peer-group EVPN
 !
 address-family l2vpn evpn
  neighbor EVPN activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf TENANT-A
 bgp router-id 10.255.1.4
 no bgp ebgp-requires-policy
 neighbor 198.51.100.21 remote-as 65302
 !
 address-family ipv4 unicast
  neighbor 198.51.100.21 activate
  neighbor 198.51.100.21 route-map RM-FROM-FW-DEFAULT in
  neighbor 198.51.100.21 route-map RM-TO-FW-TENANT-A out
  neighbor 198.51.100.21 send-community
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
