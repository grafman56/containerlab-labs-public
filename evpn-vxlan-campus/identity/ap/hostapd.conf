# ap-a1: WPA2-Enterprise access point, standing in for an Aruba AP.
#
# eap_server=0 again: the AP authenticates nobody. It relays EAP inside RADIUS
# to the NAC and enforces what comes back. Same three-party model as the wired
# authenticator, different radio.
interface=wlan0
driver=nl80211
ssid=eduroam
hw_mode=g
channel=1
ieee80211n=1

wpa=2
wpa_key_mgmt=WPA-EAP
rsn_pairwise=CCMP
ieee8021x=1
eap_server=0

auth_server_addr=10.20.20.20
auth_server_port=1812
auth_server_shared_secret=edge-secret

acct_server_addr=10.20.20.20
acct_server_port=1813
acct_server_shared_secret=edge-secret

nas_identifier=ap-a1.campus.edu
radius_acct_interim_interval=30

# THE PART THAT MATTERS.
#
# The wired authenticator in this lab hands you Tunnel-Private-Group-ID and
# leaves you to act on it by hand. A real AP does not. With dynamic_vlan on,
# hostapd reads the attribute out of the Access-Accept and puts that station
# into that VLAN itself: it creates wlan0.<vid>, creates eth1.<vid> on the
# tagged uplink, bridges them together, and the station's traffic leaves
# tagged with no further configuration.
#
# So the chain really is end to end here. The NAC decides a VLAN, the AP acts
# on it, the switch trunks it, and the leaf maps the VLAN to a VNI. Two
# stations on one radio land in two different VRFs on the fabric.
dynamic_vlan=1
vlan_file=/cfg/ap/hostapd.vlan
vlan_tagged_interface=eth1
vlan_naming=1

logger_stdout=-1
logger_stdout_level=1
