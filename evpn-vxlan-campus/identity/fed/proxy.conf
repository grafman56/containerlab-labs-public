# The national roaming operator. It holds no credentials and authenticates
# no one; it routes realms to the institution that owns them.
proxy server {
    default_fallback = no
}

home_server remote-edu {
    type   = auth+acct
    ipaddr = 10.20.20.40
    port   = 1812
    secret = idp-secret
    status_check  = status-server
    check_interval = 10
    num_answers_to_alive = 3
}

home_server_pool remote-edu-pool {
    type = fail-over
    home_server = remote-edu
}

realm remote.edu {
    auth_pool = remote-edu-pool
    nostrip
}

# A realm this operator does not know is a dead end. Rejecting here, rather
# than defaulting somewhere, is what stops a typo'd realm from leaking
# credentials to an unrelated institution.
realm DEFAULT {
}
