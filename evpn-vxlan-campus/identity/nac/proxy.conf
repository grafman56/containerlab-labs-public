# Realm routing. This is the whole trick of eduroam: the realm after the @
# decides where the request goes.
proxy server {
    default_fallback = no
}

home_server eduroam-nro {
    type   = auth+acct
    ipaddr = 10.20.20.30
    port   = 1812
    secret = fed-secret
    # An unreachable federation peer must fail fast and visibly, not hang.
    status_check  = status-server
    check_interval = 10
    num_answers_to_alive = 3
}

home_server_pool eduroam-pool {
    type = fail-over
    home_server = eduroam-nro
}

# Ours: terminate locally.
realm campus.edu {
    # Keep the realm on the User-Name. Without nostrip, suffix rewrites
    # User-Name to the bare account and the files lookup below -- which is
    # keyed on the full identity -- stops matching. Keeping the realm is also
    # what you want on an eduroam site: "jsmith" is ambiguous across a
    # federation, "jsmith@campus.edu" is not.
    nostrip
}

# Realms the federation owns. A production Service Provider usually writes
# this as `realm DEFAULT { auth_pool = ... }` -- catch everything that is not
# ours and send it to the roaming operator.
#
# DO NOT do that here without reading the next paragraph, because it cost an
# afternoon to diagnose and the symptom points nowhere near the cause.
#
# With a DEFAULT pool, PEAP's *inner* request -- the one inside the TLS
# tunnel, carrying the real username -- also gets matched against the realm
# list and proxied as EAP to the roaming operator. The federation has never
# heard of your local users, so it rejects them, and what you see at the
# supplicant is:
#
#     MS-CHAP-Error = "E=691 R=1 ... M=Authentication rejected"
#
# which reads exactly like a wrong password. Local users fail, roaming users
# work, and nothing in the message mentions proxying. Confirm it by looking
# for an Access-Reject arriving at the NAC *from the proxy* (10.20.20.30)
# rather than being generated locally:
#
#   docker exec clab-evpn-vxlan-campus-nac \
#     grep "Received Access-Reject" /tmp/radius.log
#
# It is also a privacy problem, not only an outage: the inner identity is the
# thing PEAP exists to protect, and this ships it off-site.
#
# Listing the realms explicitly sidesteps it entirely, and is a legitimate SP
# configuration. Reproducing the trap is an exercise in the README.
realm remote.edu {
    auth_pool = eduroam-pool
    nostrip
}

realm DEFAULT {
}
