# Campus staff, over the air. Same credential and same realm as the wired
# profile; only the transport differs.
#
# ca_cert and domain_suffix_match are the point of this file. A supplicant
# that trusts any valid certificate is the one an evil twin harvests
# credentials from, because anybody can stand up an SSID called eduroam. On a
# real campus eduroam CAT and MDM exist to deliver exactly these two lines to
# devices you do not administer.
ctrl_interface=/var/run/wpa_supplicant
network={
    ssid="eduroam"
    key_mgmt=WPA-EAP
    eap=PEAP
    anonymous_identity="anonymous@campus.edu"
    identity="jsmith@campus.edu"
    password="labpass"
    phase2="auth=MSCHAPV2"
    # No subjectAltName on these certificates: FreeRADIUS signs the server
    # cert with xpextensions, so alt_names in server.cnf is ignored.
    # domain_suffix_match therefore falls back to matching the CN, which here
    # is radius.campus.edu. Real deployments should carry a SAN.
    ca_cert="/cfg/sta/nac-ca.pem"
    domain_suffix_match="campus.edu"
}
