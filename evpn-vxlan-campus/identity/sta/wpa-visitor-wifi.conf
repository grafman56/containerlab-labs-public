# eduroam visitor, over the air, associating to the same SSID as everyone
# else. That is the whole premise of eduroam: one SSID, your own credential.
#
# The visited site never learns the identity below. It proxies on the realm,
# and the inner method terminates at remote.edu.
#
# Note the certificate pinned here is the HOME institution's, not the visited
# site's -- the TLS tunnel runs end to end from this device to remote.edu, and
# passes through the visited NAC as opaque EAP.
ctrl_interface=/var/run/wpa_supplicant
network={
    ssid="eduroam"
    key_mgmt=WPA-EAP
    eap=PEAP
    anonymous_identity="anonymous@remote.edu"
    identity="visitor@remote.edu"
    password="roampass"
    phase2="auth=MSCHAPV2"
    # No subjectAltName on these certificates: FreeRADIUS signs the server
    # cert with xpextensions, so alt_names in server.cnf is ignored.
    # domain_suffix_match therefore falls back to matching the CN, which here
    # is radius.remote.edu. Real deployments should carry a SAN.
    ca_cert="/cfg/sta/idp-remote-ca.pem"
    domain_suffix_match="remote.edu"
}
