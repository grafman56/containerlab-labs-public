# eduroam visitor from another institution.
#
# anonymous_identity is what every RADIUS hop between here and remote.edu
# sees. identity is inside the TLS tunnel and is visible ONLY to remote.edu.
# Setting anonymous_identity to the real username is a reportable defect, and
# `verify-identity.sh` asserts that it has not happened.
ctrl_interface=/var/run/wpa_supplicant
eapol_version=2
ap_scan=0
network={
    key_mgmt=IEEE8021X
    eap=PEAP
    anonymous_identity="anonymous@remote.edu"
    identity="visitor@remote.edu"
    password="roampass"
    phase2="auth=MSCHAPV2"
}
