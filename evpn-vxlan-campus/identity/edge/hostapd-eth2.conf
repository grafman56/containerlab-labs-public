# 802.1X authenticator on one access port.
#
# eap_server=0 is the important line: this switch does NOT authenticate
# anybody. It relays EAP inside RADIUS and enforces whatever comes back. It
# never sees a credential. That is the whole three-party model.
interface=eth2
driver=wired
ieee8021x=1
eap_server=0
use_pae_group_addr=1

auth_server_addr=10.20.20.20
auth_server_port=1812
auth_server_shared_secret=edge-secret

acct_server_addr=10.20.20.20
acct_server_port=1813
acct_server_shared_secret=edge-secret

nas_identifier=edge-a1.campus.edu
radius_acct_interim_interval=30

logger_stdout=-1
logger_stdout_level=1
