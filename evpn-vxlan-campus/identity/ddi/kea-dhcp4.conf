{
"Dhcp4": {
    "interfaces-config": { "interfaces": [ "eth1", "eth2" ] },
    // Persist the leases so there is a register to READ.
    //
    // A DDI system's value to everything else on the network is that its
    // bindings are queryable: BlueCat Address Manager answers "who holds
    // 10.10.10.100, and until when" over an API, and that answer is the only
    // MAC-to-IP edge anyone has. RADIUS accounting from hostapd carries no
    // Framed-IP-Address, so without this file the NAC's session and the
    // firewall's address-keyed policy cannot be joined at all.
    //
    // persist:false was the default here and it made the lab's DDI node a
    // protocol demonstration with no database -- which is the one thing
    // BlueCat actually is.
    "lease-database": {
        "type": "memfile",
        "persist": true,
        "lfc-interval": 3600,
        "name": "/tmp/kea-leases4.csv"
    },
    "valid-lifetime": 600,

    "subnet4": [
        {
            "id": 1010,
            "subnet": "10.10.10.0/24",
            "pools": [ { "pool": "10.10.10.100 - 10.10.10.150" } ],
            "option-data": [
                { "name": "routers",             "data": "10.10.10.1" },
                { "name": "domain-name-servers", "data": "10.20.20.50" },
                { "name": "domain-name",         "data": "campus.edu" }
            ]
        },
        {
            "id": 1030,
            "subnet": "10.30.30.0/24",
            "pools": [ { "pool": "10.30.30.100 - 10.30.30.150" } ],
            "option-data": [
                { "name": "routers",             "data": "10.30.30.1" },
                { "name": "domain-name-servers", "data": "10.20.20.50" }
            ]
        },
        {
            "id": 1020,
            "subnet": "10.20.20.0/24",
            "pools": [ { "pool": "10.20.20.100 - 10.20.20.150" } ],
            "option-data": [
                { "name": "routers",             "data": "10.20.20.1" },
                { "name": "domain-name-servers", "data": "10.20.20.50" }
            ]
        }
    ],

    "loggers": [ {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "/tmp/kea.log" } ],
        "severity": "DEBUG",
        "debuglevel": 50
    } ]
}
}
