options {
    directory "/var/cache/bind";
    listen-on { any; };
    allow-query { any; };
    recursion yes;
    allow-recursion { 10.0.0.0/8; };
    dnssec-validation no;
};

# Forward zone for the campus. On a real BlueCat this is where the DHCP half
# writes A records back as leases are issued, which is how a hostname tracks
# an endpoint across a reboot. That write is the DDI integration people mean
# when they say "DNS and DHCP are the same product".
zone "campus.edu" {
    type master;
    file "/cfg/ddi/db.campus.edu";
    allow-update { 10.0.0.0/8; };
};
