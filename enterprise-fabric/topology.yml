---
name: ent_fabric
provider: clab

defaults:
  device: srlinux
  providers:
    clab:
      lab_prefix: ""
      forwarded:
        ssh: 2200
        https: 4400

module: [ ospf, bgp ]
plugin: [ fabric ]

addressing:
  loopback:
    ipv4: 10.255.0.0/24
  router_id:
    ipv4: 10.255.0.0/24
  p2p:
    ipv4: 10.0.0.0/16
    prefix: 31
  mgmt:
    ipv4: 172.20.20.0/24
    start: 100
    _network: netlab_mgmt

ospf:
  area: 0.0.0.0

bgp:
  as: 65000

fabric:
  spines: 2
  leafs: 4
  link.pool: p2p

groups:
  spines:
    bgp.rr: true

nodes:
  S1:
    id: 1
  S2:
    id: 2
  L1:
    id: 11
    bgp.originate: [ 10.101.0.0/24 ]
  L2:
    id: 12
    bgp.originate: [ 10.102.0.0/24 ]
  L3:
    id: 13
    bgp.originate: [ 10.103.0.0/24 ]
  L4:
    id: 14
    bgp.originate: [ 10.104.0.0/24 ]

validate:
  ospf:
    description: Every fabric switch has two OSPF neighbors
    wait: 45
    wait_msg: Waiting for the OSPF underlay to converge
    nodes: [ S1, S2, L1, L2, L3, L4 ]
    devices: [ srlinux ]
    exec: show network-instance default protocols ospf neighbor
    valid: stdout.lower().count('full') >= 2
  bgp:
    description: iBGP sessions to both route reflectors are established
    wait: 45
    wait_msg: Waiting for iBGP route-reflector sessions
    nodes: [ L1, L2, L3, L4 ]
    devices: [ srlinux ]
    exec: show network-instance default protocols bgp neighbor
    valid: stdout.lower().count('established') >= 2
