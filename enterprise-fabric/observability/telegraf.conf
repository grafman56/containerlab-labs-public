[agent]
  interval = "15s"
  round_interval = true
  flush_interval = "15s"
  hostname = "enterprise-fabric-collector"

[[inputs.gnmi]]
  addresses = [
    "172.20.20.101:57400",
    "172.20.20.102:57400",
    "172.20.20.111:57400",
    "172.20.20.112:57400",
    "172.20.20.113:57400",
    "172.20.20.114:57400"
  ]
  username = "$SRL_USERNAME"
  password = "$SRL_PASSWORD"
  encoding = "json_ietf"
  redial = "10s"
  enable_tls = true
  insecure_skip_verify = true

  [[inputs.gnmi.subscription]]
    name = "interfaces"
    origin = "openconfig"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "15s"

  [[inputs.gnmi.subscription]]
    name = "interface_state"
    origin = "openconfig"
    path = "/interfaces/interface/state"
    subscription_mode = "on_change"

  [[inputs.gnmi.subscription]]
    name = "bgp_neighbors"
    origin = "openconfig"
    path = "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state"
    subscription_mode = "sample"
    sample_interval = "15s"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "network-lab"
  bucket = "telemetry"
