apiVersion: 1

datasources:
  - name: Network Telemetry
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: network-lab
      defaultBucket: telemetry
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUX_TOKEN
    isDefault: true
