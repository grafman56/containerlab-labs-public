services:
  influxdb:
    image: influxdb:2.7.12
    container_name: enterprise-fabric-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?set INFLUXDB_ADMIN_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: network-lab
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  telegraf:
    image: telegraf:1.35.1
    container_name: enterprise-fabric-telegraf
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      SRL_USERNAME: ${SRL_USERNAME:?set SRL_USERNAME in .env}
      SRL_PASSWORD: ${SRL_PASSWORD:?set SRL_PASSWORD in .env}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - default
      - netlab_mgmt

  grafana:
    image: grafana/grafana:12.1.0
    container_name: enterprise-fabric-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

networks:
  netlab_mgmt:
    external: true
    name: netlab_mgmt

volumes:
  influxdb-data:
  grafana-data:
