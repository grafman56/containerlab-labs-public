frr defaults traditional
hostname ce2b
service integrated-vtysh-config
log stdout
!
interface eth1
 ip address 10.255.2.2/30
exit
!
interface lo
 ip address 10.10.2.1/24
 ip address 172.16.200.1/24
exit
!
router bgp 65202
 bgp router-id 10.10.2.1
 no bgp ebgp-requires-policy
 neighbor 10.255.2.1 remote-as 65000
 neighbor 10.255.2.1 description pe
 address-family ipv4 unicast
  network 10.10.2.0/24
  network 172.16.200.0/24
 exit-address-family
exit
!
