frr defaults traditional
hostname pe1
service integrated-vtysh-config
log stdout
!
interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
 isis passive
exit
!
interface eth1
 ip address 10.1.1.1/30
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 ip address 10.1.2.1/30
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth3 vrf CUST-A
 ip address 10.255.1.1/30
exit
!
interface eth4 vrf CUST-B
 ip address 10.255.1.1/30
exit
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 10.0.0.1/32 index 1
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 description pe2
 neighbor 10.0.0.2 update-source lo
 address-family ipv4 vpn
  neighbor 10.0.0.2 activate
 exit-address-family
exit
!
router bgp 65000 vrf CUST-A
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.255.1.2 remote-as 65101
 neighbor 10.255.1.2 description ce1a
 address-family ipv4 unicast
  neighbor 10.255.1.2 activate
  label vpn export auto
  rd vpn export 65000:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf CUST-B
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.255.1.2 remote-as 65201
 neighbor 10.255.1.2 description ce1b
 address-family ipv4 unicast
  neighbor 10.255.1.2 activate
  label vpn export auto
  rd vpn export 65000:200
  rt vpn both 65000:200
  export vpn
  import vpn
 exit-address-family
exit
!
